<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUEGO 3 EN RAYA</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <main class="container py-4">
        <section class="row justify-content-center">
            <article class="col-12 col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <header class="mb-4">
                            <h1 class="text-center">
                                Juego 3 en Línea
                            </h1>
                        </header>
                        <section class="mb-4">

                    <!-- Jugador X -->
                            <div class="row align-items-center mb-3">
                                <div class="col-2">
                                    <div class="border rounded text-center p-1">
                                        <img src="img/X.jpg" alt="Jugador X" class="img-fluid" style="max-height: 36px;">
                                    </div>
                                </div>

                                <div class="col">
                                    <input
                                        type="text"
                                        id="txtJugadorX"
                                        class="form-control">
                                </div>
                            </div>

                    <!--  Jugador O -->
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <div class="border rounded text-center p-1">
                                        <img src="img/O.jpg" alt="Jugador O" class="img-fluid" style="max-height: 36px;">
                                    </div>
                                </div>

                                <div class="col">
                                    <input
                                        type="text"
                                        id="txtJugadorO"
                                        class="form-control">
                                </div>
                            </div>
                    <!-- Boton iniciar -->
                        </section>
                          <section class="mb-4">
                            <div class="d-grid">
                                <button type="button" onclick="iniciar()" class="btn btn-primary rounded-pill px-4">
                                    Iniciar Juego
                                </button>
                            </div>
                        </section>
                         <section class="text-center mb-3">
                    <!-- Turnos -->
                            <div class="alert alert-info text-center fw-bold mb-4" role="alert">
                                Turno: <span id="lblTurno"></span>
                            </div>
                        </section>

                    <!-- Tablero -->
                        <div class="mx-auto border rounded overflow-hidden" style="max-width: 300px;">
    
                            <!-- Fila 1 -->
                                <div class="row g-0">
                                    <div class="col-4">
                                        <div class="border bg-white ratio ratio-1x1 casilla" data-pos="1" onclick="jugar(1)">
                                            <img src="img/111.jpg" class="w-100 h-100 object-fit-cover opacity-25" alt="sombra">
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="border bg-white ratio ratio-1x1 casilla" data-pos="2" onclick="jugar(2)">
                                            <img src="img/111.jpg" class="w-100 h-100 object-fit-cover opacity-25" alt="sombra">
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="border bg-white ratio ratio-1x1 casilla" data-pos="3" onclick="jugar(3)">
                                            <img src="img/111.jpg" class="w-100 h-100 object-fit-cover opacity-25" alt="sombra">
                                        </div>
                                    </div>
                                </div>

                            <!-- Fila 2 -->
                            <div class="row g-0">
                                <div class="col-4">
                                    <div class="border bg-white ratio ratio-1x1 casilla" data-pos="4" onclick="jugar(4)">
                                        <img src="img/111.jpg" class="w-100 h-100 object-fit-cover opacity-25" alt="sombra">
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="border bg-white ratio ratio-1x1 casilla" data-pos="5" onclick="jugar(5)">
                                        <img src="img/111.jpg" class="w-100 h-100 object-fit-cover opacity-25" alt="sombra">
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="border bg-white ratio ratio-1x1 casilla" data-pos="6" onclick="jugar(6)">
                                        <img src="img/111.jpg" class="w-100 h-100 object-fit-cover opacity-25" alt="sombra">
                                    </div>
                                </div>
                            </div>

                            <!-- Fila 3 -->
                            <div class="row g-0">
                                <div class="col-4">
                                    <div class="border bg-white ratio ratio-1x1 casilla" data-pos="7" onclick="jugar(7)">
                                        <img src="img/111.jpg" class="w-100 h-100 object-fit-cover opacity-25" alt="sombra">
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="border bg-white ratio ratio-1x1 casilla" data-pos="8" onclick="jugar(8)">
                                        <img src="img/111.jpg" class="w-100 h-100 object-fit-cover opacity-25" alt="sombra">
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="border bg-white ratio ratio-1x1 casilla" data-pos="9" onclick="jugar(9)">
                                        <img src="img/111.jpg" class="w-100 h-100 object-fit-cover opacity-25" alt="sombra">
                                    </div>
                                </div>
                            </div>

                        </div>

                    </div>
                </div>
            </article>
        </section>
            </main>
            <script>
            let turno = document.getElementById("lblTurno");
            let jugadorX = document.getElementById("txtJugadorX");
            let jugadorO = document.getElementById("txtJugadorO");
            let casillas = document.getElementsByClassName("casilla");

            let turnoActual = "X";

            function iniciar()
            {
                turnoActual = "X";

                if (jugadorX.value != "") {
                    turno.innerHTML = jugadorX.value;
                } else {
                    turno.innerHTML = "Jugador X";
                }

                for (let i = 0; i < casillas.length; i++) {
                    let imagen = casillas[i].querySelector("img");
                    imagen.src = "img/111.jpg";
                    imagen.classList.add("opacity-25");
                }
            }

            function jugar(pos)
            {
                let imagen = casillas[pos - 1].querySelector("img");

                if (imagen.classList.contains("opacity-25")) {
                    imagen.classList.remove("opacity-25");

                    if (turnoActual == "X") {
                        imagen.src = "img/X.jpg";
                        turnoActual = "O";
                        turno.innerHTML = jugadorO.value != "" ? jugadorO.value : "Jugador O";
                    } else {
                        imagen.src = "img/O.jpg";
                        turnoActual = "X";
                        turno.innerHTML = jugadorX.value != "" ? jugadorX.value : "Jugador X";
                    }
                }
            }
        </script>

</body>
</html>
